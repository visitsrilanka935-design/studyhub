<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyHub Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  


</head>
<body>
  <style>.music-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  text-align: center;
  z-index: 9999;
}

.music-popup button {
  background-color: #4a90e2;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  margin: 10px;
  transition: 0.2s;
}

.music-popup button:hover {
  background-color: #357bd8;
}
</style>



<!-- 🎧 Study Music Section -->
<div id="musicPrompt" class="music-popup">
  <h3>🎶 Do you want to study with focus music?</h3>
  <button id="playMusicBtn">Yes, play music</button>
  <button id="noMusicBtn">No, thanks</button>
</div>

<!-- Background Music (hidden audio) -->
<audio id="studyMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2023/01/26/audio_35e3f8ffbb.mp3?filename=lofi-study-beat-140062.mp3" type="audio/mpeg">
</audio>
<script>
  const musicPopup = document.getElementById("musicPrompt");
  const studyMusic = document.getElementById("studyMusic");
  const playMusicBtn = document.getElementById("playMusicBtn");
  const noMusicBtn = document.getElementById("noMusicBtn");

  // Show message when dashboard loads
  window.addEventListener("load", () => {
    setTimeout(() => {
      musicPopup.style.display = "block";
    }, 1000); // delay 1 second
  });

  // If student wants music
  playMusicBtn.addEventListener("click", () => {
    studyMusic.play();
    musicPopup.style.display = "none";
    localStorage.setItem("studyMusic", "on");
  });

  // If student doesn't want music
  noMusicBtn.addEventListener("click", () => {
    musicPopup.style.display = "none";
    localStorage.setItem("studyMusic", "off");
  });

  // Auto-play music if student chose it before
  window.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("studyMusic") === "on") {
      studyMusic.play();
    }
  });
</script>








  <nav class="navbar">
    <h2>📘 StudyHub</h2>
    <div class="nav-links">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="study.html">Study Importance</a>
      <a href="profile.html">Profile</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="dashboard">
    <section class="timer">
  <h2>⏰ Study Timer</h2>
  <div class="timer-display" id="timer">00:00:00</div>
  <div class="timer-buttons">
    <button id="startBtn">Start</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>
</section>

<!-- Link to the new timer JS -->
<script src="study-timer.js"></script>


      <h1>👋 Welcome back, <span id="username">Student</span>!</h1>
      <p>Here’s your learning progress for today.</p>
   </section>
  


   <div class="profile">
  <h3>📊 Your Stats</h3>
  <ul>
    <li>Target Score: <span id="targetScore">--</span></li>
    <li>Start Date: <span id="startDate">--</span></li>
    <li>Exam Date: <span id="examDate">--</span></li>
  </ul>
</div>
<script>
  const user = JSON.parse(localStorage.getItem('user'));

  if (user) {
    document.getElementById('username').textContent = user.username;
    document.getElementById('targetScore').textContent = user.target;
    document.getElementById('startDate').textContent = user.startDate;
    document.getElementById('examDate').textContent = user.examDate;
  } else {
    // If no user, redirect to sign in
    window.location.href = 'index.html';
  }

  function logout() {
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }
</script>
<script>
// Example data — replace these with real dashboard variables
const user = localStorage.getItem('username') || "Student";
const targetScore = 'targetScore';
const startDate = 'startDate';
const examDate = 'examDate';
const totalStudyTime = localStorage.getItem('studyTime') || "00:00:00";

// Save to localStorage (so Profile page can read it)
localStorage.setItem('targetScore', targetScore);
localStorage.setItem('startDate', startDate);
localStorage.setItem('examDate', examDate);
localStorage.setItem('studyTime', totalStudyTime);
</script>



    <section class="progress">
      <h2>📊 Your Study Progress</h2>
      <canvas id="progressChart"></canvas>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
